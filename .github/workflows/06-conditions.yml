name: 06 Conditions (if expressions)

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  check-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: 常に実行
        run: echo "always runs"

      - name: mainブランチのときだけ
        if: github.ref == 'refs/heads/main'
        run: echo "This is main branch"

      - name: mainブランチ以外
        if: github.ref != 'refs/heads/main'
        run: echo "This is NOT main branch: ${{ github.ref_name }}"

      - name: 失敗させる（次のステップのテスト用）
        id: failing-step
        run: exit 1
        continue-on-error: true  # 失敗してもワークフローを止めない

      - name: 前のステップが失敗したときだけ
        if: steps.failing-step.outcome == 'failure'
        run: echo "前のステップは失敗しました"

      - name: 前のステップが成功したときだけ（実行されない）
        if: steps.failing-step.outcome == 'success'
        run: echo "前のステップは成功しました"

  status-functions:
    runs-on: ubuntu-latest
    needs: check-conditions
    # needs が失敗しても実行したい場合は always() が必要
    if: always()
    steps:
      - name: success() - 全ての前提ジョブが成功
        if: success()
        run: echo "success()"

      - name: failure() - いずれかの前提ジョブが失敗
        if: failure()
        run: echo "failure()"

      - name: always() - 常に実行
        if: always()
        run: echo "always()"

      - name: cancelled() - キャンセルされた場合
        if: cancelled()
        run: echo "cancelled()"
