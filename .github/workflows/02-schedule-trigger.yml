name: 02 Schedule Trigger

on:
  schedule:
    # UTC時間で指定。JSTはUTC+9なので、JST 09:00 = UTC 00:00
    - cron: "0 0 * * 1-5"  # 平日の朝9時（JST）に実行
  workflow_dispatch: {}     # 手動でも実行できるようにしておく

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    steps:
      - name: 実行時刻を表示
        run: |
          echo "Run at: ${{ github.event.schedule }}"
          echo "Triggered by: ${{ github.event_name }}"
          date

      - name: スケジュール実行のときだけ
        if: github.event_name == 'schedule'
        run: echo "これはスケジュール実行です"

      - name: 手動実行のときだけ
        if: github.event_name == 'workflow_dispatch'
        run: echo "これは手動実行です"
